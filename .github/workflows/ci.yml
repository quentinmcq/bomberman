name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint et tests
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      BOMBERMAN_NO_AUDIO: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer uv et Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Bibliothèques système requises par Qt (rendu offscreen)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3

      - name: Installer le projet et les outils de développement
        run: uv sync --locked --group dev

      - name: Lint (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Tests (pytest)
        run: uv run pytest

  audit:
    name: Audit des dépendances (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer uv et Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: pip-audit sur les dépendances verrouillées
        run: |
          uv export --format requirements-txt --no-emit-project --no-hashes -o requirements-lock.txt
          uvx pip-audit -r requirements-lock.txt --no-deps --progress-spinner off
