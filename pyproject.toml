[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bomberman"
version = "2.0.0"
description = "Bomberman-like à 1-4 joueurs en PyQt6 (projet scolaire 2019, modernisé)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14.7"
authors = [{ name = "Quentin Macq" }]
keywords = ["game", "pyqt6", "bomberman"]
dependencies = ["PyQt6>=6.11"]

[project.scripts]
bomberman = "bomberman.__main__:main"

[dependency-groups]
dev = ["pytest>=9.1.1", "ruff>=0.16.5"]

[tool.setuptools]
packages = ["bomberman", "bomberman.ui"]

[tool.setuptools.package-data]
bomberman = ["assets/images/*.png", "assets/sounds/*.wav"]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"bomberman/ui/*.py" = ["N802"]
"tests/test_ui.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["bomberman", "tools", "helpers"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
